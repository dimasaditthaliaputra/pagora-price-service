services:
  app:
    build: .
    env_file: .env
    restart: unless-stopped
    # Hanya listen di localhost; ekspos publik lewat Caddy (HTTPS).
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - price_data:/srv/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
  price_data:
